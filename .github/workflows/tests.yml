name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Home Assistant test dependencies
        run: python -m pip install -r requirements_test.txt
      - name: Run tests
        run: node --test tests/*.test.js
      - name: Run Home Assistant integration tests
        run: pytest
