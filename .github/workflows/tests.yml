name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node --test tests/*.test.js
